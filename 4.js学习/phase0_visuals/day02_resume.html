<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML骨架 - 杨强练习版</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin:0px;
                background-color:#f4f4f4;
            }
            main {
                width: 800px;
                margin: 50px auto;
                background-color:white;
                padding: 40px;
                border: 1px solid #ddd;
            }
            section {
                margin-bottom: 30px;
            }

        </style>
    </head>
    <body>
        <main>
            <header>
            <h1>杨强</h1>
            <p>Python开发者｜AI爱好者｜准全栈工程师</p>
        </header>

        <section>
            <h2>技术栈</h2>
            <ul>
                <li>python</li>
                <li>AI/LLM</li>
                <li>pandas</li>
            </ul>
        </section>

        <section>
            <form>
                <label for="subscribe-email">订阅周报：</label>
                <input type="email" id="subscribe-email" placeholder="请输入您的邮箱">
                <button type="button">订阅</button>
            </form>
        </section>

        <section>
            <h2>学习经历</h2>
            <ol>
                <li>学习python基础</li>
                <li>掌握20个标准库</li>
                <li>深入AI大模型微调</li>
            </ol>
        </section>

        <section>
            <h2>给AI发送消息</h2>
            <label for="user-input">请输入Prompt</label>
            <input type="text" id="user-input" placeholder="例如：解释一下量化交易">
            <button type="button">发送</button>
        </section>

        <section>
            <h2>展位图</h2>
            <img src="example.jpg" alt="示例图片">
        </section>

        <footer>
            <p>&copy;2026 杨强. Using VS Code & Live Server.</p>
        </footer>

        </main>
        
    </body>
</html>
