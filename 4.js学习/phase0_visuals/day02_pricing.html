<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>产品定价卡</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            background-color: lightgray;
        }
        section {
            display: inline-block;
            background-color: white;
            width: 250px;
            border: 1px solid #ccc;
            /* 增加一些间距让卡片别挨着 */
            margin: 10px;
            /* 增加内边距让内容好看点 */
            padding: 20px;
            /* 对齐方式优化：顶部对齐 */
            vertical-align: top; 
        }
        ul {
            list-style: none;
            padding: 0; /* 清除 ul 默认左内边距 */
        }
        h2 {

            font-size: large;
        }
        h1 {
            font-size: x-large;

            
        }
        li {
            margin-bottom: 10px;
            text-align: center; /* 列表项文字居中 */
        }
        button {
            display: block;
            color: white;
            background-color: pink;
            border: none;
            text-align: center;
            margin: 0 auto;
            padding: 10px 20px; /* 按钮胖一点 */
            width: 100%; /* 按钮撑满 */
            cursor: pointer; /* 鼠标变小手 */
        }
    </style>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;"> <!-- 父容器居中所有 inline-block 卡片 -->
        <section>
            <h2 class="name">基础版</h2>
            <h1>¥99/月</h1>
            <ul>
                <li>1个项目</li>
                <li>基础数据分析</li>
                <li>邮件支持</li>
            </ul>
            <button type="button">立即购买</button>
        </section>
        <section>
            <h2>进阶版</h2>
            <h1>¥199/月</h1>
            <ul>
                <li>10个项目</li>
                <li>高级AI模型</li>
                <li>7x24支持</li>
            </ul>
            <button type="button">立即购买</button>
        </section>
        <section>
            <h2>尊享版</h2>
            <h1>¥299/月</h1>
            <ul>
                <li>无限项目</li>
                <li>私有化部署</li>
                <li>专属客户经理</li>
            </ul>
            <button type="button">立即购买</button>
        </section>
    </div>
</body>
</html>
