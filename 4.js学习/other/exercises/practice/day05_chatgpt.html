<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --sidebar-bg: #202123;    /* 侧边栏深灰 */
            --main-bg: #343541;       /* 主区域灰 */
            --text-primary: #ECECF1;  /* 主要文字白 */
            --text-secondary: #8E8EA0;/* 次要文字灰 */
            --hover-bg: #2A2B32;      /* 鼠标悬停色 */
            /* 尺寸 */
            --sidebar-width: 260px;
        }
        .app-container {
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
 
        }
        .new-chat {
            height: 100px;
            padding: 10px;
        }
        button {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer; 
        }
        button:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .user {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            height: 100px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .new-list {
            flex:1;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        input {
            width: 100%;
            padding: 12px;
            color: white;
            background-color: rgba(64, 65, 79, 1);
            border-radius: 20px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            
        }   
        li {
            padding: 10px;
            list-style: none;
            cursor: pointer;
            border-radius: 5px;
        }
        li:hover {
            background-color: var(--hover-bg);
        }
        .avatar {
            width: 30px;
            height: 30px;
            background-color: purple;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main {
            background-color: var(--main-bg);
            color: var(--text-primary);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            display: flex;
            padding: 20px;
            gap: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .ai-message {
            background-color: #444654;
        }
        .user-message {
            background-color: transparent;
        }
        .gpt-avatar {
            background-color: green;
        }

           

    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="new-chat">
                <button>+ New chat</button>
            </div>
            <div class="new-list">
                <ul>
                    <li>历史问题1</li>
                    <li>历史问题2</li>
                    <li>历史问题3</li>
                    <li>历史问题4</li>
                    <li>历史问题5</li>
                    <li>历史问题6</li>
                </ul>
            </div>
            <div class="user">
                <div class="avatar"></div>
                <span>User</span>
            </div>
        </div>
        <div class="main">
            <div class="chat-area">
                <div class="message user-message">
                    <div class="avatar">U</div>
                    <div class="content">你好，请帮我写首诗。</div>
                </div>
                <div class="message ai-message">
                    <div class="avatar gpt-avatar">B</div>
                    <div class="content">床前明月光，疑是地上霜。</div>
                </div>
            
            </div>
        <div class="input-area"><input type="text" placeholder="你有什么问题吗？"></div>
    </div>
    
</body>
</html>
