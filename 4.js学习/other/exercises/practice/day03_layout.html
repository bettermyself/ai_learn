<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 圣杯布局</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer {
            background-color: #333;
            color:white;
            padding: 20px;
            text-align: center;
        }
        .content-wrapper {
            background-color: #eee;
            display: flex;
            flex: 1;
            flex-direction: row-reverse;
        }
        aside {
            background-color: #2c3e50;
            color: white;
            width: 200px;
            padding: 20px;
        }
        main {
            background-color: white;
            padding: 20px;
            flex: 1;
        }
    </style>
</head>
<body>
    <header>Header</header>

    <div class="content-wrapper">
        <aside>Sidebar</aside>
        <main>
            <h1>Main content</h1>
            <p>即使这里的内容很少...</p>
        </main>
    </div>

    <footer>Footer(永远在底部)</footer>
    
</body>
</html>
