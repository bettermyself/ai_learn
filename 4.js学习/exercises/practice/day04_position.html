<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 04 Positioning</title>
    <style>
        body {
            height: 2000px;
            padding: 50px;
        }
        .parent {
            width: 200px;
            height: 200px;
            background-color: red;
            position: relative;
        }
        .child {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: relative;
            top: 50%;
            left: 50%;
            /* margin-left: -25px;
            margin-top: -25px; */
            transform: translate(-50%, -50%);
        }
        .back-to-top {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: red;
            z-index: 2;
        }
        .overlay {
            position: fixed;
            top:0;
            left:0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
  
        }
    </style>
</head>
<body>
    
    <button class="back-to-top">Top</button>
    <h1>定位实验：子绝父相</h1>
    <div class="parent">
        <div class="child">我是子元素</div>
        <p>我是正文内容</p>
    </div>
    <div class="overlay"></div>
</body>
</html>
